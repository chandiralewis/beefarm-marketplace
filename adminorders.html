<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - View Orders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #fffaf0;
    }
    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0; left: 0;
      width: 230px;
      height: 100vh;
      background-color: #1a1a1a;
      color: #f7c600;
      padding-top: 20px;
      display: flex;
      flex-direction: column;
    }
    .sidebar h2 { text-align: center; margin-bottom: 30px; color: #f7c600; font-weight: bold; }
    .sidebar a {
      color: #f7c600;
      padding: 14px 20px;
      text-decoration: none;
      margin-bottom: 5px;
      border-radius: 6px;
      transition: 0.3s;
    }
    .sidebar a:hover,
    .sidebar a.active { background-color: #f7c600; color: #1a1a1a; }

    /* Main content */
    .main-content {
      margin-left: 230px;
      padding: 30px;
    }
    h2 { text-align:center; margin-bottom:20px; }

    .container-box {
      max-width: 1000px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .status-badge {
      padding:5px 10px;
      border-radius:5px;
      font-size: 14px;
      color:white;
    }
    .ordered { background:#ffc107; }   /* yellow */
    .shipped { background:#0d6efd; }   /* blue */
    .delivered { background:#198754; } /* green */

    /* Footer */
    footer {
      margin-left: 230px;
      background-color: #1a1a1a;
      color: #f7c600;
      text-align: center;
      padding: 12px 0;
      position: fixed;
      bottom: 0;
      width: calc(100% - 230px);
      font-size: 14px;
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>BeeFarm Admin</h2>
  <a href="admindashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a href="adminorders.html" class="active"><i class="bi bi-bag-check-fill"></i> Customer Orders</a>
  <a href="trakingadmin.html"><i class="bi bi-clock-history"></i> Track Orders</a>
  <a href="adminnotification.html"><i class="bi bi-bell-fill"></i> Notifications</a>
  <a href="adminprofile.html"><i class="bi bi-person-circle"></i> Profile</a>
  <a href="BeeLanding.html"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<!-- Main content -->
<div class="main-content">
  <div class="container-box">
    <h2>Customer Orders</h2>
    <table class="table table-bordered table-hover" id="ordersTable">
      <thead class="table-dark">
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Address</th>
          <th>ZIP</th>
          <th>Total (Rs.)</th>
          <th>Status</th>
          <th>Placed At</th>
        </tr>
      </thead>
      <tbody>
        <!-- Orders will be inserted here with JS -->
      </tbody>
    </table>
  </div>
</div>

<!-- Footer -->
<footer>
  © 2025 BeeFarm Marketplace | Made with <span>♥</span> by BeeFarm Team
</footer>

<script>
  // Example demo data (later you can load from PHP + DB)
  const orders = [
    {id:101, customer:"John Doe", address:"Colombo", zip:"10001", total:"2500.00", status:"Ordered", date:"2025-09-28 10:20"},
    {id:102, customer:"Jane Smith", address:"Kandy", zip:"20000", total:"3200.50", status:"Shipped", date:"2025-09-28 11:00"},
    {id:103, customer:"Amal Perera", address:"Galle", zip:"80000", total:"1500.00", status:"Delivered", date:"2025-09-27 09:15"}
  ];

  const tbody = document.querySelector("#ordersTable tbody");

  orders.forEach(order => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${order.id}</td>
      <td>${order.customer}</td>
      <td>${order.address}</td>
      <td>${order.zip}</td>
      <td>${order.total}</td>
      <td><span class="status-badge ${order.status.toLowerCase()}">${order.status}</span></td>
      <td>${order.date}</td>
    `;

    tbody.appendChild(tr);
  });
</script>
</body>
</html>
